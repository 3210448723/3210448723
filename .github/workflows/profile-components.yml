name: Refresh profile components

on:
  push:
    branches: [main, design/maintained-components]
    paths:
      - README.md
      - .github/workflows/profile-components.yml
      - package.json
      - package-lock.json
      - scripts/update-community.mjs
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: profile-components
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Render GitHub Readme Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=3210448723&show_icons=true&theme=github_dark&hide_rank=true&hide=prs,issues&include_all_commits=true&card_width=390&disable_animations=true&custom_title=GitHub%20Stats
          path: assets/stats.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Render top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=3210448723&layout=compact&theme=github_dark&card_width=390&langs_count=6&exclude_repo=3210448723.github.io,3210448723&disable_animations=true
          path: assets/languages.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Set up the community component runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Fetch the maintained Metrics templates
        uses: actions/checkout@v4
        with:
          repository: lowlighter/metrics
          ref: latest
          path: .metrics-source
          persist-credentials: false
          sparse-checkout: source/templates/classic

      - name: Install the template runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Refresh public contributions with Metrics templates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run render:community

      - name: Validate generated component images
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('stats.svg', 'languages.svg', 'metrics-community.svg'):
              path = Path('assets') / name
              root = ET.parse(path).getroot()
              content = ' '.join(root.itertext()).lower()
              for error in ('resource not accessible', 'something went wrong', 'could not fetch', 'no recent contributions matching filters found'):
                  if error in content:
                      raise SystemExit(f'{name}: unexpected error or empty component')
              print(f'Validated {name}: {path.stat().st_size} bytes')
          PY

      - name: Commit updated component images
        run: |
          git add assets/stats.svg assets/languages.svg assets/metrics-community.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile components'
          git push
